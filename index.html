<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tablito a déménagé</title>
  <link rel="canonical" href="https://tablito.app/" />
  <style>
    body{font-family:-apple-system,system-ui,sans-serif;background:#FBF6EC;color:#1E1A2E;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
    .card{max-width:360px}
    h1{font-size:1.45rem;margin:0 0 .5rem}
    p{color:#555;line-height:1.5;margin:.5rem 0}
    a.btn{display:inline-block;margin-top:1.25rem;background:#4F46BA;color:#fff;text-decoration:none;padding:15px 30px;border-radius:999px;font-weight:700;font-size:1.05rem}
    small{color:#999;display:block;margin-top:1rem}
  </style>
</head>
<body>
  <div class="card">
    <h1>Tablito a déménagé 🐣</h1>
    <p>L'appli vit maintenant sur <strong>tablito.app</strong>. On t'y emmène <strong>avec ta progression</strong>.</p>
    <a id="go" class="btn" href="https://tablito.app/">Continuer vers Tablito →</a>
    <small id="hint"></small>
  </div>
  <script>
    (function () {
      var DEST = 'https://tablito.app/';
      var link = document.getElementById('go');
      var hint = document.getElementById('hint');
      function b64url(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      function finish(target){
        link.href = target;
        if (target.indexOf('#import=') !== -1) { hint.textContent = 'Ta progression voyage avec toi.'; }
        // En navigateur classique : saut auto. En PWA installée : iOS bloque le
        // saut cross-origin auto → on laisse l'utilisateur toucher le bouton.
        if (!standalone) { location.replace(target); }
      }
      try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){}); } catch(e){}
      var json=null; try{ json=localStorage.getItem('multiplix-profile'); }catch(e){}
      if (!json) { finish(DEST); return; }
      var bytes = new TextEncoder().encode(json);
      if ('CompressionStream' in window) {
        new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()
          .then(function(buf){ finish(DEST + '#import=z' + b64url(new Uint8Array(buf))); })
          .catch(function(){ finish(DEST + '#import=r' + b64url(bytes)); });
      } else {
        finish(DEST + '#import=r' + b64url(bytes));
      }
    })();
  </script>
</body>
</html>
