<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tablito a déménagé</title>
  <link rel="canonical" href="https://tablito.app/" />
  <script>
    // Émetteur du pont de migration. Tablito a déménagé sur https://tablito.app/
    // (origine différente). Cette page (servie sur l'ancienne origine
    // isc.github.io) lit le profil dans le localStorage local et le transmet à
    // tablito.app via le fragment #import=<flag><base64url>, que l'app importe
    // au boot (cf. src/lib/storage.ts importProfileFromUrl). flag 'z' = gzip.
    (function () {
      var DEST = 'https://tablito.app/';
      function b64url(u8) {
        var s = '';
        for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      function go(payload) { location.replace(payload ? DEST + '#import=' + payload : DEST); }
      // Nettoie un éventuel ancien SW /multiplix/ encore enregistré.
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
            .catch(function () {});
        }
      } catch (e) {}
      var json = null;
      try { json = localStorage.getItem('multiplix-profile'); } catch (e) {}
      if (!json) { go(null); return; }
      var bytes = new TextEncoder().encode(json);
      if ('CompressionStream' in window) {
        new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip')))
          .arrayBuffer()
          .then(function (buf) { go('z' + b64url(new Uint8Array(buf))); })
          .catch(function () { go('r' + b64url(bytes)); });
      } else {
        go('r' + b64url(bytes));
      }
    })();
  </script>
</head>
<body><p>Tablito a déménagé. <a href="https://tablito.app/">Continuer →</a></p></body>
</html>
